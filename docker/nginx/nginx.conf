# KuberOne local gateway — unified entry on :80
#   /api/*  /health*  → API
#   /*                → Admin CRM
# Direct ports still exposed: admin :5173, web-public :5174, customer :8081, dsa :8082

upstream kuberone_backend {
    server backend:4000;
    keepalive 16;
}

upstream kuberone_admin {
    server admin:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location = /gateway-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /health {
        proxy_pass http://kuberone_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://kuberone_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://kuberone_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
