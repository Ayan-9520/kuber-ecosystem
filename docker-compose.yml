# KuberOne — full stack (one command from repo root)
#   docker compose up -d --build
#   docker compose down
#   docker compose logs -f
#   docker compose ps
#
# Defaults: .env.docker (auto-loaded into containers) + inline defaults below.
# Infra only (host dev):  docker compose up -d mysql redis
# Integration tests:       docker compose --profile integration up -d mysql-integration

name: kuberone

x-pull-never: &pull-never
  pull_policy: never

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  APP_ENV: ${APP_ENV:-development}
  API_PORT: 4000
  API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
  API_VERSION: ${API_VERSION:-v1}
  DATABASE_URL: ${DATABASE_URL:-mysql://root@mysql:3306/kuberone_dev}
  DATABASE_CONNECTION_LIMIT: ${DATABASE_CONNECTION_LIMIT:-10}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret-min-32-chars-long}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret-min-32-chars-long}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-change-me-field-encryption-key-min-32-chars}
  JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
  JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost:5174,http://localhost:8081,http://localhost:8082,http://localhost:5175,http://127.0.0.1:5175,https://kuberone.online,https://www.kuberone.online,https://partner.kuberone.online,https://kuberfinserve.com,https://www.kuberfinserve.com}
  WEBSITE_INTAKE_API_KEY: ${WEBSITE_INTAKE_API_KEY:-kuber-website-intake-local-key}
  PUBLIC_PROFILE_BASE_URL: ${PUBLIC_PROFILE_BASE_URL:-http://localhost:5174}
  DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:-/app/apps/backend/storage/documents}
  AWS_REGION: ${AWS_REGION:-ap-south-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:-kuberone-dev-documents}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  DEPLOYMENT_ROLLOUT_PHASE: ${DEPLOYMENT_ROLLOUT_PHASE:-staged}
  OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-0}

services:
  mysql:
    image: mysql:8.0
    container_name: kuberone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kuberone_dev}
    ports:
      - '${DOCKER_MYSQL_PORT:-3307}:3306'
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=8M
      --performance-schema=OFF
      --max-connections=50
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 180s
    volumes:
      - kuberone_mysql_data:/var/lib/mysql
    networks: [kuberone]

  redis:
    image: redis:7.2-alpine
    container_name: kuberone-redis
    restart: unless-stopped
    ports:
      - '${DOCKER_REDIS_PORT:-6380}:6379'
    command: redis-server --save 60 1 --loglevel warning --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - kuberone_redis_data:/data
    networks: [kuberone]

  backend:
    <<: *pull-never
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: kuberone-backend:local
    container_name: kuberone-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      <<: *api-env
      API_WORKERS_ENABLED: 'false'
      AUTOMATION_WORKER_ENABLED: 'false'
      CONTENT_WORKER_ENABLED: 'false'
      BACKUP_WORKER_ENABLED: 'false'
      DOCKER_RUN_MIGRATIONS: ${DOCKER_RUN_MIGRATIONS:-true}
      DOCKER_SEED_ON_START: ${DOCKER_SEED_ON_START:-true}
    ports:
      - '${DOCKER_API_PORT:-4000}:4000'
    volumes:
      - kuberone_uploads:/app/apps/backend/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health/live']
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 600s
    networks: [kuberone]

  worker:
    <<: *pull-never
    image: kuberone-backend:local
    container_name: kuberone-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
      - path: .env.docker
        required: false
    environment:
      <<: *api-env
      API_PORT: 4001
      API_BASE_URL: http://worker:4001
      API_WORKERS_ENABLED: 'true'
      AUTOMATION_WORKER_ENABLED: ${AUTOMATION_WORKER_ENABLED:-true}
      CONTENT_WORKER_ENABLED: ${CONTENT_WORKER_ENABLED:-true}
      BACKUP_WORKER_ENABLED: ${BACKUP_WORKER_ENABLED:-false}
      DOCKER_RUN_MIGRATIONS: 'false'
      DOCKER_SEED_ON_START: 'false'
    volumes:
      - kuberone_uploads:/app/apps/backend/storage
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4001/health/live']
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [kuberone]

  admin:
    <<: *pull-never
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: kuberone-admin:local
    container_name: kuberone-admin
    restart: unless-stopped
    ports:
      - '${DOCKER_ADMIN_PORT:-5173}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [kuberone]

  web-public:
    <<: *pull-never
    build:
      context: .
      dockerfile: docker/web-public/Dockerfile
    image: kuberone-web-public:local
    container_name: kuberone-web-public
    restart: unless-stopped
    ports:
      - '${DOCKER_WEB_PUBLIC_PORT:-5174}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [kuberone]

  mobile-customer:
    <<: *pull-never
    build:
      context: .
      dockerfile: docker/mobile-customer/Dockerfile
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-/api/v1}
    image: kuberone-mobile-customer:local
    container_name: kuberone-mobile-customer
    restart: unless-stopped
    ports:
      - '${DOCKER_MOBILE_CUSTOMER_PORT:-8081}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [kuberone]

  mobile-dsa:
    <<: *pull-never
    build:
      context: .
      dockerfile: docker/mobile-dsa/Dockerfile
      args:
        EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-/api/v1}
    image: kuberone-mobile-dsa:local
    container_name: kuberone-mobile-dsa
    restart: unless-stopped
    ports:
      - '${DOCKER_MOBILE_DSA_PORT:-8082}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [kuberone]

  nginx:
    <<: *pull-never
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: kuberone-nginx:local
    container_name: kuberone-nginx
    restart: unless-stopped
    ports:
      - '${DOCKER_NGINX_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
      admin:
        condition: service_healthy
      web-public:
        condition: service_healthy
      mobile-customer:
        condition: service_healthy
      mobile-dsa:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/gateway-health']
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [kuberone]

  mysql-integration:
    profiles: [integration]
    image: mysql:8.0
    container_name: kuberone-integration-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: integration
      MYSQL_DATABASE: kuberone_integration_test
    ports:
      - '${DOCKER_INTEGRATION_MYSQL_PORT:-3308}:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-pintegration']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kuberone_integration_mysql_data:/var/lib/mysql
    networks: [kuberone]

networks:
  kuberone:
    name: kuberone_net
    driver: bridge

volumes:
  kuberone_mysql_data:
    name: kuberone_dev_mysql_data
  kuberone_redis_data:
    name: kuberone_dev_redis_data
  kuberone_uploads:
    name: kuberone_uploads
  kuberone_integration_mysql_data:
    name: kuberone_integration_mysql_data
